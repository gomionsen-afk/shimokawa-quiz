<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字RPG - 零 - スマホ最適化版</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #000; color: #fff; 
            font-family: "MS Mincho", "Hiragino Mincho ProN", serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; height: 100dvh; margin: 0; padding: 5px; overflow: hidden; 
        }
        #game-screen { 
            border: 2px solid #fff; width: 100%; max-width: 380px; height: 100%; max-height: 100dvh; 
            padding: 8px; display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden;
        }
        .view { display: none; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
        .view.active { display: flex; }
        .global-info { display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 3px; border-bottom: 1px solid #444; color: #ff0; height: 26px; align-items: center; flex-shrink: 0; }
        h2 { border-bottom: 1px solid #fff; padding-bottom: 3px; text-align: center; font-size: 15px; margin: 3px 0; flex-shrink: 0; }
        .guide-text { font-size: 9px; color: #888; text-align: center; margin-bottom: 2px; flex-shrink: 0; }
        
        /* スクロールエリア */
        .box-list { 
            border: 1px solid #333; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: #050505; align-content: start;
            -webkit-overflow-scrolling: touch; 
        }
        .box-item { border: 1px solid #555; text-align: center; cursor: pointer; font-size: 18px; position: relative; height: 48px; display: flex; align-items: center; justify-content: center; background: #111; user-select: none; }
        .box-item.selected { border-color: #0f0; background: #030; box-shadow: inset 0 0 5px #0f0; }
        .box-item .rarity { font-size: 7px; position: absolute; top: 1px; left: 2px; color: #ff0; }
        .box-item .shop-hint { font-size: 6px; position: absolute; bottom: 1px; right: 2px; color: #0aa; border: 1px solid #044; padding: 0 1px; }
        
        #turn-order { font-size: 11px; color: #ff0; text-align: center; height: 20px; line-height: 20px; border-bottom: 1px solid #222; white-space: nowrap; overflow: hidden; flex-shrink: 0; }
        .unit-area { display: flex; justify-content: space-around; height: 105px; align-items: center; background: #050505; border: 1px solid #111; width: 100%; box-sizing: border-box; flex-shrink: 0; }
        .char-box { text-align: center; width: 30%; height: 95px; opacity: 0.4; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; border: 1px solid transparent; }
        .active-unit { opacity: 1; border: 1px solid #fff; background: #222; }
        .selectable { cursor: pointer; border: 1px dashed #0f0; opacity: 1; animation: flash 1s infinite; }
        @keyframes flash { 0% { border-color: #0f0; } 50% { border-color: #fff; } 100% { border-color: #0f0; } }
        .dead { opacity: 0.1 !important; filter: grayscale(1); pointer-events: none; }
        .kanji { font-size: 30px; line-height: 1; margin-bottom: 3px; }
        
        .hp-bar-bg { width: 85%; height: 5px; background: #300; border: 1px solid #444; position: relative; }
        .hp-bar-fill { height: 100%; background: #f00; width: 100%; transition: width 0.3s; }
        .stats-text { font-size: 9px; color: #ccc; margin-top: 1px; font-family: monospace; }
        
        #log { flex: 1; border: 1px solid #333; margin: 4px 0; padding: 5px; font-size: 11px; overflow-y: auto; background: #050505; color: #eee; -webkit-overflow-scrolling: touch; }
        
        /* コントロール */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; height: 44px; flex-shrink: 0; }
        button { background: #000; color: #fff; border: 1px solid #fff; cursor: pointer; font-family: inherit; font-size: 13px; border-radius: 4px; user-select: none; }
        button:active { background: #222; }
        button:disabled { border-color: #333; color: #444; cursor: not-allowed; background: #000; }
        
        .gacha-btn { background: #202; border-color: #a0a; font-size: 10px; line-height: 1.1; }
        .gacha-btn span { display: block; font-size: 7px; color: #d0d; }
        .boss-btn { background: #300; border-color: #f00; }
        .exit-btn { background: #222; color: #fff; border: 1px solid #666; font-size: 10px; padding: 1px 5px; height: 20px; cursor: pointer; border-radius: 3px; }
        .buy-btn span { display: block; font-size: 7px; color: #ff0; }

        #gacha-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        #gacha-effect-text { font-size: 20px; color: #a0a; margin-bottom: 12px; letter-spacing: 4px; animation: pulse 1s infinite; }
        #gacha-kanji-display { font-size: 90px; text-shadow: 0 0 20px #fff; height: 100px; line-height: 100px; text-align: center; }
        .rarity-high { text-shadow: 0 0 30px #ff0 !important; color: #ff0; }
        #gacha-result-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; width: 95%; margin-top: 10px; max-height: 180px; overflow-y: auto; }
        .gacha-res-item { width: 50px; height: 50px; background: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .aura-btn { background: #033; border-color: #0aa; font-size: 10px; line-height: 1.1; }
        .aura-btn span { display: block; font-size: 7px; color: #0cc; }
        .sell-btn { background: #332200; border-color: #aaaa00; font-size: 10px; line-height: 1.1; color: #ff0; }
        .sell-btn span { display: block; font-size: 7px; color: #ccaabb; }
        .section-title { font-size: 10px; color: #0cc; margin: 2px 0 1px 0; padding-left: 4px; text-align: left; width: 100%; flex-shrink: 0; }
        .aura-item { font-size: 9px !important; line-height: 1.1; border-color: #088 !important; height: 48px; }
        .aura-item .aura-type { font-size: 12px; font-weight: bold; color: #0ff; }
        .aura-item .aura-effect { font-size: 7px; color: #aaa; margin-top: 1px; }
        
        .equipped-badge { font-size: 6px; position: absolute; bottom: 1px; left: 2px; color: #f0f; border: 1px solid #f0f; padding: 0 1px; background: #202; }
        .current-aura-display { border: 1px dashed #0aa; background: #011; padding: 4px; margin: 3px 0; font-size: 11px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

        .seed-box-item { font-size: 9px !important; border-color: #050 !important; color: #0f0; background: #010; flex-direction: column; height: 48px; }
        .seed-box-title { font-size: 11px; font-weight: bold; }
        .seed-box-cost { font-size: 6px; color: #8c8; margin-top: 1px; }

        /* オーラ発光アニメーション */
        .glow-回避 { animation: pulse-blue 2s infinite ease-in-out; }
        @keyframes pulse-blue {
            0% { color: #d0f0ff; text-shadow: 0 0 6px rgba(0, 128, 255, 0.7); }
            50% { color: #ffffff; text-shadow: 0 0 15px rgba(0, 160, 255, 1); }
            100% { color: #d0f0ff; text-shadow: 0 0 6px rgba(0, 128, 255, 0.7); }
        }
        .glow-行動力 { animation: pulse-red 2s infinite ease-in-out; }
        @keyframes pulse-red {
            0% { color: #ffd0d0; text-shadow: 0 0 6px rgba(255, 0, 0, 0.7); }
            50% { color: #ffffff; text-shadow: 0 0 15px rgba(255, 60, 60, 1); }
            100% { color: #ffd0d0; text-shadow: 0 0 6px rgba(255, 0, 0, 0.7); }
        }
        .glow-会心 { animation: pulse-purple 2s infinite ease-in-out; }
        @keyframes pulse-purple {
            0% { color: #ffd0ff; text-shadow: 0 0 6px rgba(200, 0, 255, 0.7); }
            50% { color: #ffffff; text-shadow: 0 0 15px rgba(230, 60, 255, 1); }
            100% { color: #ffd0ff; text-shadow: 0 0 6px rgba(200, 0, 255, 0.7); }
        }
        .glow-回復 { animation: pulse-green 2s infinite ease-in-out; }
        @keyframes pulse-green {
            0% { color: #d0ffd0; text-shadow: 0 0 6px rgba(0, 255, 128, 0.7); }
            50% { color: #ffffff; text-shadow: 0 0 15px rgba(60, 255, 160, 1); }
            100% { color: #d0ffd0; text-shadow: 0 0 6px rgba(0, 255, 128, 0.7); }
        }
    </style>
</head>
<body>

<div id="game-screen">
    <div id="gacha-overlay">
        <div id="gacha-effect-text">召喚の儀</div>
        <div id="gacha-kanji-display"></div>
        <div id="gacha-result-name" style="margin-top:12px; font-size:15px; color:#ff0; min-height: 22px;"></div>
        <div id="gacha-result-list"></div>
        <button id="gacha-close-btn" onclick="closeGachaEffect()" style="margin-top:15px; padding: 6px 20px; display:none;">拝受</button>
    </div>

    <div class="global-info">
        <span>金: <span id="global-coin-count">0</span> コイン</span>
        <div>
            <span id="header-stage-label">拠点</span>
            <button id="btn-retreat" class="exit-btn" style="display:none; margin-left:8px;" onclick="location.reload()">拠点に戻る</button>
        </div>
    </div>

    <div id="view-home" class="view active">
        <h2>深淵の拠点</h2>
        <div class="guide-text" id="home-guide-text" style="color:#0cc;">※キャラ選択後に種タップでスキル付与。Wタップで修練。</div>
        
        <div class="section-title">【仲間の漢字】</div>
        <div id="my-box" class="box-list" style="flex: 1.2; min-height: 60px;"></div>
        
        <div class="section-title">【所持オーラ】</div>
        <div id="aura-box" class="box-list" style="flex: 0.9; min-height: 55px;"></div>

        <div class="section-title">【抽出したスキルの種】</div>
        <div id="seed-box" class="box-list" style="flex: 0.9; min-height: 55px;"></div>

        <div class="controls" style="grid-template-columns: repeat(6, 1fr); height: 42px; margin-top: 4px; gap: 3px;">
            <button id="btn-gacha-1" class="gacha-btn" onclick="playGacha(1)">単発<span>(10c)</span></button>
            <button id="btn-gacha-10" class="gacha-btn" onclick="playGacha(10)">10連<span>(100c)</span></button>
            <button id="btn-gacha-aura" class="aura-btn" onclick="playAuraGacha()">霊気<span>(30c)</span></button>
            <button class="sell-btn" onclick="sellCharacter()">売却<span>(コイン)</span></button>
            <button class="boss-btn" onclick="openBossSelection()">強者</button>
            <button id="btn-start" onclick="startGame()">出撃</button>
        </div>
    </div>

    <div id="view-boss-select" class="view">
        <h2 style="color:#f00;">強者の間</h2>
        <div id="boss-list" class="box-list" style="grid-template-columns: 1fr; flex: 1;"></div>
        <button onclick="closeBossSelection()" style="height:40px; margin-top:8px; flex-shrink:0;">拠点に戻る</button>
    </div>

    <div id="view-shop" class="view">
        <h2 style="color:#0aa; font-size:14px;">修練・継承・装具の儀</h2>
        <div id="shop-unit-detail" style="text-align:center; padding:4px; border:1px solid #0aa; margin-bottom:3px; background:#011; flex-shrink:0;"></div>
        
        <div id="current-aura-zone"></div>

        <div class="buy-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:4px; flex-shrink:0;">
            <button class="buy-btn" onclick="buyStat('p', 300)">攻撃+1<span>(300c)</span></button>
            <button class="buy-btn" onclick="buyStat('h', 300)">HP+1<span>(300c)</span></button>
            <button class="buy-btn" onclick="buyStat('s', 500)">速さ+1<span>(500c)</span></button>
            <button class="buy-btn" onclick="buyStat('m', 800)">MP+1<span>(800c)</span></button>
        </div>
        
        <div class="section-title" id="shop-sub-title">【装備可能なオーラ一覧】</div>
        <div class="seed-list" id="shop-inventory-list" style="flex:1; border:1px solid #222; background:#000; font-size:11px; padding:4px; overflow-y:auto; display:flex; flex-direction:column; gap:3px;"></div>
        
        <button id="btn-extract" onclick="extractSkill()" style="margin: 4px 0 2px 0; background:#303; font-size:11px; height:28px; flex-shrink:0;">スキル抽出（※オーラは手元に戻ります）</button>
        <button onclick="closeShop()" style="height:38px; flex-shrink:0;">拠点に戻る</button>
    </div>

    <div id="view-battle" class="view">
        <div id="turn-order"></div>
        <div id="enemy-area" class="unit-area"></div>
        <div id="log"></div>
        <div id="player-area" class="unit-area"></div>
        <div class="controls" style="margin-top:4px;">
            <button id="btn-atk" onclick="startTargetSelection('attack')">たたかう</button>
            <button id="btn-skl" onclick="startTargetSelection('skill')">スキル</button>
        </div>
    </div>
</div>

<script>
const charData = [
    { name: '蟻', r: 1, p: 1, h: 3, m: 0, s: 1 }, { name: '蝿', r: 1, p: 1, h: 3, m: 0, s: 3 },
    { name: '雀', r: 1, p: 2, h: 5, m: 0, s: 5 }, { name: '蚊', r: 1, p: 1, h: 2, m: 3, s: 1, skill: "吸血", cost: 3 },
    { name: '蛾', r: 1, p: 1, h: 3, m: 1, s: 2, skill: "鱗粉", cost: 1 }, { name: '犬', r: 2, p: 3, h: 6, m: 0, s: 4 },
    { name: '蜘蛛', r: 2, p: 4, h: 3, m: 1, s: 1, skill: "地獄の糸", cost: 1 }, { name: '梟', r: 2, p: 3, h: 5, m: 5, s: 5, skill: "賢者の知恵", cost: 2 },
    { name: '鮫', r: 4, p: 5, h: 7, m: 0, s: 5 }, { name: '蟋蟀', r: 2, p: 3, h: 2, m: 3, s: 3, skill: "レクイエム", cost: 3 },
    { name: '龍', r: 5, p: 12, h: 30, m: 10, s: 5, skill: "咆哮", cost: 5 }, { name: '鳳', r: 5, p: 8, h: 20, m: 20, s: 15, skill: "転生", cost: 10 },
    { name: '鼠', r: 1, p: 2, h: 2, m: 0, s: 2 }, { name: '蜥蜴', r: 2, p: 1, h: 2, m: 4, s: 4, skill: "身代わり", cost: 2 },
    { name: '甲虫', r: 2, p: 3, h: 4, m: 0, s: 1 }, { name: '熊', r: 4, p: 7, h: 10, m: 0, s: 3 },
    { name: '蛆', r: 1, p: 0, h: 1, m: 0, s: 1, skill: "再生", cost: 0, special: true },
    { name: '壁蝨', r: 1, p: 3, h: 1, m: 1, s: 1, skill: "血欲", cost: 1 }, { name: '鸚哥', r: 1, p: 1, h: 3, m: 5, s: 1, skill: "物真似", cost: 5 },
    { name: '狼', r: 2, p: 2, h: 3, m: 0, s: 2, special: true }, 
    { name: '蜻蛉', r: 2, p: 3, h: 2, m: 0, s: 5 }, { name: '蟷螂', r: 3, p: 4, h: 3, m: 0, s: 6 },
    { name: '孔雀', r: 3, p: 2, h: 4, m: 6, s: 3, skill: "魅了", cost: 3 },
    { name: '雷鰻', r: 4, p: 3, h: 10, m: 4, s: 3, skill: "感電", cost: 2 },
    { name: '蛇', r: 2, p: 2, h: 3, m: 2, s: 3, skill: "毒牙", cost: 1 },
    { name: '蜜蜂', r: 1, p: 1, h: 3, m: 6, s: 2, skill: "甘い蜜", cost: 2 },
    { name: '王蛇', r: 4, p: 12, h: 14, m: 0, s: 12, skill: "丸呑み", cost: 0 }
];

const auraTypes = ['回避', '行動力', '会心', '回復'];
const auraSpecs = {
    '回避': { 1: {val: 5, txt: "回避5%"}, 2: {val: 12, txt: "回避12%"}, 3: {val: 20, txt: "回避20%"}, 4: {val: 30, txt: "回避30%"}, 5: {val: 40, txt: "回避40%"} },
    '行動力': { 1: {val: 1, txt: "行動+1"}, 2: {val: 2, txt: "行動+1~2"}, 3: {val: 2, txt: "行動+2"}, 4: {val: 3, txt: "行動+2~3"}, 5: {val: 3, txt: "行動+3"} },
    '会心': { 1: {val: 20, txt: "会心20%"}, 2: {val: 30, txt: "会心30%"}, 3: {val: 40, txt: "会心40%"}, 4: {val: 60, txt: "会心60%"}, 5: {val: 80, txt: "会心80%"} },
    '回復': { 1: {val: 10, txt: "毎ターン10%"}, 2: {val: 15, txt: "毎ターン15%"}, 3: {val: 20, txt: "毎ターン20%"}, 4: {val: 30, txt: "毎ターン30%"}, 5: {val: 40, txt: "毎ターン40%"} }
};

const stageBaseData = [
    ['蟻','蝿'], ['蜻蛉','蚊'], ['狼','狼','狼'], ['孔雀','雀'], ['雷鰻','雀'],
    ['蟷螂','雷鰻'], ['梟','孔雀'], ['龍','蟷螂'], ['雷鰻','雷鰻','鳳'], ['龍','鳳','龍']
];
const bossListData = ['雷鰻', '王蛇'];

let coins = 0, box = [], selectedIds = [], seeds = [], auras = [], shopTargetId = null;
let isBossMode = false, currentBossName = null;

let touchStartY = 0;
let isScrollingDetected = false;

function handleTouchStart(e) {
    touchStartY = e.touches[0].clientY;
    isScrollingDetected = false;
}

function handleTouchMove(e) {
    if (Math.abs(e.touches[0].clientY - touchStartY) > 10) {
        isScrollingDetected = true; 
    }
}

function saveData() { localStorage.setItem('kanji_rpg_AURA_TYPE_GLOW_V2', JSON.stringify({ coins, box, selectedIds, seeds, auras })); }
function loadData() {
    const saved = localStorage.getItem('kanji_rpg_AURA_TYPE_GLOW_V2');
    if (saved) {
        const d = JSON.parse(saved);
        box = (d.box || []).filter(c => c && c.name);
        coins = Number(d.coins) || 0;
        selectedIds = (d.selectedIds || []).filter(sid => box.some(b => b.id === sid));
        seeds = d.seeds || [];
        auras = d.auras || [];
        return true;
    } return false;
}

function updateHomeUI() {
    document.getElementById('global-coin-count').innerText = coins;
    
    document.getElementById('btn-gacha-1').disabled = (coins < 10);
    document.getElementById('btn-gacha-10').disabled = (coins < 100);
    document.getElementById('btn-gacha-aura').disabled = (coins < 30);

    document.getElementById('my-box').innerHTML = box.map(c => {
        let auraBadge = "";
        if (c.auraId) {
            const au = auras.find(a => a.id === c.auraId);
            if (au) auraBadge = `<span class="equipped-badge">${au.type}</span>`;
        }
        return `<div class="box-item ${selectedIds.includes(c.id)?'selected':''}" 
                    ontouchstart="handleTouchStart(event)" 
                    ontouchmove="handleTouchMove(event)"
                    ontouchend="if(!isScrollingDetected){ handleBoxClick(${c.id}); }"
                    onclick="if(typeof TouchEvent === 'undefined'){ handleBoxClick(${c.id}); }">
            <span class="rarity">${'★'.repeat(c.r || 1)}</span>
            ${c.name}
            ${auraBadge}
            <span class="shop-hint">修練</span>
        </div>`;
    }).join('');
        
    document.getElementById('aura-box').innerHTML = auras.map(a => {
        const owner = box.find(b => b.auraId === a.id);
        const ownerText = owner ? `<div style="font-size:7px; color:#f0f; margin-top:1px;">装着:${owner.name}</div>` : `<div style="font-size:7px; color:#0f0; margin-top:1px;">未装着</div>`;
        return `<div class="box-item aura-item" style="opacity: ${owner ? 0.6 : 1}">
            <span class="rarity">${'★'.repeat(a.r)}</span>
            <div class="aura-type">${a.type}</div>
            <div class="aura-effect">${a.text}</div>
            ${ownerText}
        </div>`;
    }).join('');

    const seedBox = document.getElementById('seed-box');
    if (seeds.length === 0) {
        seedBox.innerHTML = `<div style="grid-column: span 4; color: #555; text-align: center; font-size: 11px; padding-top: 10px;">種はありません</div>`;
    } else {
        seedBox.innerHTML = seeds.map((s, i) => {
            return `<div class="box-item seed-box-item" 
                        ontouchstart="handleTouchStart(event)" 
                        ontouchmove="handleTouchMove(event)"
                        ontouchend="if(!isScrollingDetected){ attachSeedFromHome(${i}); }"
                        onclick="if(typeof TouchEvent === 'undefined'){ attachSeedFromHome(${i}); }">
                <div class="seed-box-title">${s.name}</div>
                <div class="seed-box-cost">消費MP:${s.cost || 1}</div>
            </div>`;
        }).join('');
    }

    document.getElementById('btn-start').disabled = !selectedIds.length;
}

let lastClickTime = 0;
let lastClickId = null;
function handleBoxClick(id) {
    const now = Date.now();
    if (lastClickId === id && (now - lastClickTime) < 300) {
        openShop(id);
    } else {
        toggleSelect(id);
    }
    lastClickTime = now;
    lastClickId = id;
}

function attachSeedFromHome(seedIndex) {
    if (selectedIds.length === 0) {
        alert("種を付ける漢字をリストから選択（緑枠に）してください。");
        return;
    }
    const targetId = selectedIds[selectedIds.length - 1];
    const char = box.find(b => b.id === targetId);
    if (char) {
        const seed = seeds[seedIndex];
        const oldSkill = char.skill;
        if (oldSkill && !confirm(`既にスキル【${oldSkill}】を持っています。上書きして【${seed.name}】を習得させますか？`)) {
            return;
        }
        char.skill = seed.name;
        char.cost = seed.cost || 1;
        seeds.splice(seedIndex, 1);
        alert(`${char.name} に 【${seed.name}】 のスキルを付与しました！`);
        saveData();
        updateHomeUI();
    }
}

function toggleSelect(id) {
    if (selectedIds.includes(id)) selectedIds = selectedIds.filter(sid => sid !== id);
    else if (selectedIds.length < 3) selectedIds.push(id);
    updateHomeUI(); saveData();
}

function sellCharacter() {
    if (selectedIds.length === 0) {
        alert("売却したいキャラをリストから選択（緑枠に）してください。");
        return;
    }
    const targetId = selectedIds[selectedIds.length - 1];
    const charIndex = box.findIndex(b => b.id === targetId);
    if (charIndex === -1) return;
    const char = box[charIndex];

    if (box.length <= 1) {
        alert("ボックスの漢字が最後の一体のときは売却できません。");
        return;
    }

    const rates = { 1: 1, 2: 2, 3: 5, 4: 8, 5: 10, 6: 15 };
    const rarity = char.r || 1;
    const getCoin = rates[rarity] || 1;

    if (confirm(`【売却確認】\n「${char.name} (★${rarity})」を売却して ${getCoin} コインを獲得しますか？`)) {
        if (char.auraId) char.auraId = null;
        box.splice(charIndex, 1);
        selectedIds = selectedIds.filter(sid => sid !== targetId);
        coins += getCoin;
        alert(`「${char.name}」を売却し、${getCoin} コインを獲得しました！`);
        saveData();
        updateHomeUI();
    }
}

function playGacha(times) {
    const cost = (times === 10) ? 100 : 10;
    if (coins < cost) {
        alert("コインが足りません。");
        return;
    }
    coins -= cost;

    const overlay = document.getElementById('gacha-overlay');
    const display = document.getElementById('gacha-kanji-display');
    const resultName = document.getElementById('gacha-result-name');
    const resultList = document.getElementById('gacha-result-list');
    const closeBtn = document.getElementById('gacha-close-btn');
    
    overlay.style.display = 'flex';
    closeBtn.style.display = 'none';
    resultName.innerText = "";
    resultList.innerHTML = "";
    display.classList.remove('rarity-high');
    display.style.display = 'block';

    let currentPull = 0;
    let results = [];

    const pullNext = () => {
        if (currentPull >= times) {
            display.style.display = 'none';
            resultName.innerText = "── 召喚結果 ──";
            closeBtn.style.display = 'block';
            saveData();
            return;
        }

        let count = 0;
        resultName.innerText = `${currentPull + 1} 体目を召喚中...`;

        const interval = setInterval(() => {
            display.innerText = charData[Math.floor(Math.random() * charData.length)].name;
            count++;
            
            if (count > 10) {
                clearInterval(interval);
                
                let pool = charData;
                if (times === 10 && currentPull === 9) {
                    pool = charData.filter(c => c.r >= 3);
                }
                const base = pool[Math.floor(Math.random() * pool.length)];
                const newUnit = {...base, id: Math.random(), auraId: null};
                
                box.push(newUnit);
                results.push(newUnit);
                
                display.innerText = base.name;
                if (base.r >= 4) display.classList.add('rarity-high');
                else display.classList.remove('rarity-high');

                resultList.innerHTML += `
                    <div class="gacha-res-item" style="color:${base.r>=4?'#ff0':'#fff'}; border-color:${base.r>=4?'#ff0':'#444'}">
                        <span style="font-size:7px; color:#ff0;">${'★'.repeat(base.r)}</span>
                        ${base.name}
                    </div>
                `;

                currentPull++;
                setTimeout(pullNext, 150);
            }
        }, 30);
    };

    pullNext();
}

function playAuraGacha() {

        alert("コインが足りません。");
        return;
    }
    coins -= 30;

    const overlay = document.getElementById('gacha-overlay');
    const display = document.getElementById('gacha-kanji-display');

    resultList.innerHTML = "";

    display.style.display = 'block';

    let count = 0;
    const interval = setInterval(() => {

function openShop(id) { shopTargetId = id; document.getElementById('view-home').classList.remove('active'); document.getElementById('view-shop').classList.add('active'); updateShopUI(); }
function closeShop() { document.getElementById('view-shop').classList.remove('active'); document.getElementById('view-home').classList.add('active'); updateHomeUI(); }

// ─── BATTLE ENGINE ───
let party = [], enemies = [], stage = 1, queue = [], qIdx = 0, isSelecting = false, currentAction = null;
let remainingActions = 0; 

function getEquippedAura(unitBoxData) {
    if (!unitBoxData || !unitBoxData.auraId) return null;
    return auras.find(a => a.id === unitBoxData.auraId) || null;
}

function startGame() {
    isBossMode = false; remainingActions = 0;
    party = selectedIds.map(sid => { 
        const c = box.find(b => b.id === sid); 
        const aura = getEquippedAura(c);
        return {...c, curH: c.h, maxH: c.h, curM: c.m, baseP: c.p, baseS: c.s, isP: true, poison: false, guard: false, charm: 0, lastDmg: 0, aura: aura}; 
    });
    stage = 1; document.getElementById('view-home').classList.remove('active'); document.getElementById('view-battle').classList.add('active');
    document.getElementById('btn-retreat').style.display = "block";
    initBattle();
}

function startBossBattle(name) {
    isBossMode = true; currentBossName = name; remainingActions = 0;
    party = selectedIds.map(sid => { 
        const c = box.find(b => b.id === sid); 
        const aura = getEquippedAura(c);
        return {...c, curH: c.h, maxH: c.h, curM: c.m, baseP: c.p, baseS: c.s, isP: true, poison: false, guard: false, charm: 0, lastDmg: 0, aura: aura}; 
    });
    document.getElementById('view-boss-select').classList.remove('active');
    document.getElementById('view-battle').classList.add('active');
    document.getElementById('btn-retreat').style.display = "block";
    document.getElementById('header-stage-label').innerText = `強者の間`;
    let base = charData.find(c => c.name === name);
    enemies = [{...base, id: 999, curH: base.h * 3, maxH: base.h * 3, p: base.p, baseP: base.p, baseS: base.s, curM: base.m, isP: false, poison: false, guard: false, charm: 0, lastDmg: 0, aura: null}];
    document.getElementById('log').innerText = ""; addLog(`--- 強者：${name} ---`); cycle();
}

function initBattle() {
    if (stage > 50) { addLog("★完全踏破！★"); saveData(); setTimeout(()=>location.reload(), 2000); return; }
    document.getElementById('header-stage-label').innerText = `第 ${stage} 層`;
    let enemyNames = stageBaseData[(stage-1) % stageBaseData.length];
    enemies = enemyNames.map((n, i) => {
        let base = charData.find(c => c.name === n) || charData[0];
        let buff = Math.floor(stage / 4);
        return {...base, id: 900+i, curH: base.h+buff*5, maxH: base.h+buff*5, p: base.p+buff, baseP: base.p+buff, baseS: base.s, curM: base.m, isP: false, poison: false, guard: false, charm: 0, lastDmg: 0, aura: null};
    });
    document.getElementById('log').innerText = ""; addLog(`--- 第 ${stage} 層 ---`); cycle();
}

function cycle() {
    const all = [...party, ...enemies];
    all.forEach(u => {
        if (u.name === '蛆' && u.curH <= 0 && all.some(p => p.name === '蝿' && p.curH > 0 && p.isP === u.isP)) { u.curH = 1; addLog(`${u.name}が再生した！`); }
        if (u.name === '狼' && u.curH > 0) {
            const count = all.filter(o => o.name === '狼' && o.curH > 0 && o.isP === u.isP && o.id !== u.id).length;
            u.p = u.baseP + count; u.s = u.baseS + count;
        }
        u.guard = false;
    });

    queue = all.filter(u => u.curH > 0).sort((a,b)=>b.s - a.s);
    qIdx = 0; if (queue.length === 0) return next();
    document.getElementById('turn-order').innerText = queue.map(u => u.name).join(" > ");
    
    queue.forEach(u => {
        if (u.aura && u.aura.type === '回復') {
            const healPercent = u.aura.value;
            const healVal = Math.floor(u.maxH * (healPercent / 100));
            if (healVal > 0) {
                u.curH = Math.min(u.maxH, u.curH + healVal);
                addLog("🌿【回復】" + u.name + " +" + healVal);
            }
        }
    });
    updateUI();
    remainingActions = 0;
    turn();
}

async function turn() {
    isSelecting = false; currentAction = null; updateUI(); 
    const u = queue[qIdx]; if (!u || u.curH <= 0) return next();
    
    if (remainingActions <= 0) {
        remainingActions = 1;
        if (u.aura && u.aura.type === '行動力') {
            let bonus = u.aura.value; 
            if (u.aura.r === 2) bonus = Math.random() < 0.5 ? 1 : 2;
            if (u.aura.r === 4) bonus = Math.random() < 0.5 ? 2 : 3;
            
            remainingActions = bonus;
            if (remainingActions > 1) {
                addLog("⚡【行動力】" + u.name + "（行動: " + remainingActions + "回）");
            }
        }
    }

    if (u.poison) { u.curH = Math.max(0, u.curH - 1); addLog(u.name + "：毒1ダメ"); if(u.curH <= 0) return next(); }
    if (u.charm > 0) {
        u.charm--; addLog(u.name + "は魅了中！");
        await new Promise(r => setTimeout(r, 600));
        const allies = (u.isP ? party : enemies).filter(a => a.curH > 0 && a.id !== u.id);
        if (allies.length > 0) executeAction(u, allies[Math.floor(Math.random()*allies.length)], 'attack');
        else next();
        return;
    }

    if (u.isP) { 
        document.getElementById('btn-atk').disabled = false; 
        document.getElementById('btn-skl').disabled = !u.skill || u.skill === '再生'; 
    } else {
        document.getElementById('btn-atk').disabled = true; 
        document.getElementById('btn-skl').disabled = true;
        await new Promise(r => setTimeout(r, 500));
        const t_list = party.filter(p => p.curH > 0);
        if (t_list.length > 0) {
            if ((u.skill === '感電' || u.skill === '咆咆' || u.skill === '毒牙' || u.skill === '丸呑み') && u.curM >= u.cost) executeAction(u, t_list[Math.floor(Math.random()*t_list.length)], 'skill');
            else executeAction(u, t_list[Math.floor(Math.random()*t_list.length)], 'attack');
        } else next();
    }
}

function startTargetSelection(type) {
    const u = queue[qIdx];
    if (type === 'skill' && u.curM < u.cost) { addLog("MP不足！"); return; }
    if (type === 'skill' && (u.skill === '感電' || u.skill === '咆哮' || u.skill === '鱗粉')) { executeAction(u, null, 'skill'); return; }
    isSelecting = true; currentAction = type;
    addLog(type === 'attack' ? "標的を選択" : "対象を選択");
    updateUI();
}
function onUnitClick(targetId) {
    if (!isSelecting) return;
    const target = [...party, ...enemies].find(char => char.id === targetId);
    if (!target || target.curH <= 0) return;
    executeAction(queue[qIdx], target, currentAction);
    isSelecting = false; currentAction = null;
}

function executeAction(u, t, type) {
    if (type === 'attack') {
        if (t.aura && t.aura.type === '回避') {
            const dodgeChance = t.aura.value;
            if (Math.random() * 100 < dodgeChance) {
                addLog("💨【回避】" + t.name + "が避けた！");
                next();
                return;
            }
        }

        let dmg = u.p;
        let isCrit = false;
        if (u.aura && u.aura.type === '会心') {
            const critChance = u.aura.value;
            if (Math.random() * 100 < critChance) { dmg = dmg * 2; isCrit = true; }
        }

        if (t.guard) dmg = 1;
        t.curH = Math.max(0, t.curH - dmg); t.lastDmg = dmg;
        if (isCrit) addLog("💥【会心】" + u.name + "：" + dmg + "ダメ");
        else addLog(u.name + "の攻撃：" + dmg + "ダメ");
    } else {
        u.curM -= u.cost; addLog(u.name + "：【" + u.skill + "】");
        const targets = u.isP ? enemies : party;
        if (u.skill === '感電') { targets.forEach(e => { if(e.curH>0) e.curH = Math.max(0, e.curH - 3); }); }
        else if (u.skill === '魅了') { t.charm = 2; addLog(t.name + "を魅了！"); }
        else if (u.skill === '吸血') { u.curH = Math.min(u.maxH, u.curH + 3); }
        else if (u.skill === '血欲') { t.curH = Math.max(0, t.curH - 2); u.curH = Math.min(u.maxH, u.curH + 2); }
        else if (u.skill === '物真似') { t.curH = Math.max(0, t.curH - u.lastDmg); }
        else if (u.skill === '賢者の知恵') { t.curH = Math.min(t.maxH, t.curH + 5); }
        else if (u.skill === '鱗粉') targets.forEach(e => { if(e.curH>0) e.poison = true; });
        else if (u.skill === '咆哮') targets.forEach(e => { if(e.curH>0) e.curH = Math.max(0, e.curH - 8); });
        else if (u.skill === '身代わり') { u.guard = true; }
        else if (u.skill === '転生') { t.curH = t.maxH; }
        else if (u.skill === '毒牙') { t.poison = true; addLog(t.name + "を毒にした！"); }
        else if (u.skill === '甘い蜜') { t.curH = Math.min(t.maxH, t.curH + 3); addLog(t.name + "のHP回復！"); }
        else if (u.skill === '丸呑み') { t.curH = Math.max(0, t.curH - 15); addLog(t.name + "に15ダメ！"); }
    }
    next();
}

function next() {
    updateUI();
    if (enemies.every(e => e.curH <= 0)) { 
        party.forEach(p => { p.curH = p.maxH; p.curM = p.m; p.poison = false; p.charm = 0; p.guard = false; });
        
        let rewardCoin = 1;
        if (stage >= 1 && stage <= 10) rewardCoin = 1;
        else if (stage >= 11 && stage <= 20) rewardCoin = 2;
        else if (stage >= 21 && stage <= 30) rewardCoin = 3;
        else if (stage >= 31 && stage <= 50) rewardCoin = 4;
        else if (stage >= 51) rewardCoin = 5;

        coins += rewardCoin;
        addLog(`勝利！全員全回復 (報酬: +${rewardCoin}c)`);
        
        if (isBossMode) {
            addLog("強者を退けた！");
            if (Math.random() < 0.05) {
                const base = charData.find(c => c.name === currentBossName);
                box.push({...base, id: Math.random(), auraId: null});
                addLog("★" + currentBossName + "が仲間に加わった！");
            }
            saveData(); setTimeout(()=>location.reload(), 1500);
        } else {
            addLog("次の層へ..."); saveData(); stage++; setTimeout(initBattle, 800);
        }
        return; 
    }
    if (party.every(p => p.curH <= 0)) { addLog("全滅..."); setTimeout(()=>location.reload(), 2000); return; }

    remainingActions--;
    if (remainingActions > 0 && queue[qIdx] && queue[qIdx].curH > 0) {
        addLog("⚡ 連撃発動！");
        turn();
    } else {
        remainingActions = 0;
        qIdx++; 
        if (qIdx >= queue.length) cycle(); else turn();
    }
}

function updateUI() {
    const activeUnit = queue[qIdx];
    const draw = (u) => {
        let classes = `char-box ${u.curH<=0?'dead':''} ${activeUnit && u.id===activeUnit.id?'active-unit':''}`;
        if (isSelecting) classes += ' selectable';
        
        let auraClass = "";
        if (u.curH > 0 && u.aura && u.aura.type) { auraClass = `glow-${u.aura.type}`; }
        let kanjiClass = `kanji ${auraClass}`;
        
        let overrideColor = "";
        if (u.charm > 0) overrideColor = "color:#f0f;";
        else if (u.poison) overrideColor = "color:#0f0;";
        else if (u.guard) overrideColor = "color:#0aa;";
        
        return `<div class="${classes}" onclick="onUnitClick(${u.id})">
            <span class="${kanjiClass}" style="${overrideColor}">${u.name}</span>
            <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${(u.curH/u.maxH)*100}%"></div></div>
            <div class="stats-text">H:${u.curH} P:${u.p}</div>
        </div>`;
    };
    document.getElementById('player-area').innerHTML = party.map(draw).join('');
    document.getElementById('enemy-area').innerHTML = enemies.map(draw).join('');
}
function addLog(m) { const l = document.getElementById('log'); l.innerText += m + "\n"; l.scrollTop = l.scrollHeight; }

if (!loadData()) { 
    coins = 0;
    ['蟻','蝿','蛆'].forEach(n => {
