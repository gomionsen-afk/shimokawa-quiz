<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字RPG - 零 - 完全版（スキルガチャ搭載）</title>
    <style>
        body { background: #000; color: #fff; font-family: "MS Mincho", "Hiragino Mincho ProN", serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 10px 0; box-sizing: border-box; }
        #game-screen { border: 2px solid #fff; width: 380px; max-width: 95vw; min-height: 660px; padding: 10px; display: flex; flex-direction: column; background: #000; position: relative; box-sizing: border-box; }
        .view { display: none; flex-direction: column; width: 100%; box-sizing: border-box; }
        .view.active { display: flex; }
        
        .global-info { display: flex; justify-content: space-between; font-size: 13px; padding-bottom: 5px; border-bottom: 1px solid #444; color: #ff0; height: 30px; align-items: center; }
        h2 { border-bottom: 1px solid #fff; padding-bottom: 5px; text-align: center; font-size: 18px; margin: 5px 0; }
        .guide-text { font-size: 10px; color: #0cc; text-align: center; margin-bottom: 5px; }
        
        .box-list { border: 1px solid #333; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 5px; background: #050505; align-content: start; }
        .box-item { border: 1px solid #555; text-align: center; cursor: pointer; font-size: 20px; position: relative; height: 60px; display: flex; align-items: center; justify-content: center; background: #111; user-select: none; }
        .box-item.selected { border-color: #0f0; background: #030; box-shadow: inset 0 0 5px #0f0; }
        .box-item .rarity { font-size: 8px; position: absolute; top: 2px; left: 2px; color: #ff0; white-space: nowrap; transform: scale(0.85); transform-origin: top left; }
        .box-item .shop-hint { font-size: 7px; position: absolute; bottom: 2px; right: 2px; color: #0aa; border: 1px solid #044; padding: 0 1px; }
        
        #turn-order { font-size: 11px; color: #ff0; text-align: center; height: 20px; line-height: 20px; border-bottom: 1px solid #222; white-space: nowrap; overflow: hidden; }
        .unit-area { display: flex; justify-content: space-around; height: 125px; align-items: center; background: #050505; border: 1px solid #111; width: 100%; box-sizing: border-box; flex-shrink: 0; }
        .char-box { text-align: center; width: 110px; height: 115px; opacity: 0.4; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; border: 1px solid transparent; cursor: default; }
        .active-unit { opacity: 1; border: 1px solid #fff; background: #222; }
        .selectable { cursor: pointer; border: 1px dashed #0f0; opacity: 1; animation: flash 1s infinite; }
        @keyframes flash { 0% { border-color: #0f0; } 50% { border-color: #fff; } 100% { border-color: #0f0; } }
        .dead { opacity: 0.1 !important; filter: grayscale(1); pointer-events: none; }
        .dead .kanji { animation: none !important; text-shadow: none !important; }
        .kanji { font-size: 38px; line-height: 1; margin-bottom: 4px; transition: text-shadow 0.3s, color 0.3s; }
        .hp-bar-bg { width: 80%; height: 6px; background: #300; border: 1px solid #444; position: relative; }
        .hp-bar-fill { height: 100%; background: #f00; width: 100%; transition: width 0.3s; }
        .stats-text { font-size: 10px; color: #ccc; margin-top: 2px; font-family: monospace; }
        
        #log { border: 1px solid #333; margin: 5px 0; padding: 8px; font-size: 12px; overflow-y: auto; background: #050505; color: #eee; height: 120px; box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 55px; flex-shrink: 0; }
        button { background: #000; color: #fff; border: 1px solid #fff; cursor: pointer; font-family: inherit; font-size: 15px; }
        button:disabled { border-color: #333; color: #444; cursor: not-allowed; }
        
        .gacha-btn { background: #202; border-color: #a0a; font-size: 10px; line-height: 1.2; padding: 2px 1px; }
        .gacha-btn span { display: block; font-size: 7px; color: #d0d; }
        .boss-btn { background: #300; border-color: #f00; }
        .dig-btn { background: #220; border-color: #aa0; color: #ff0; }
        .exit-btn { background: #222; color: #fff; border: 1px solid #666; font-size: 10px; padding: 2px 8px; height: 24px; cursor: pointer; border-radius: 3px; }
        .buy-btn span { font-size: 9px; color: #ff0; margin-left: 4px; }

        #gacha-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        #gacha-effect-text { font-size: 24px; color: #a0a; margin-bottom: 20px; letter-spacing: 5px; animation: pulse 1s infinite; }
        #gacha-kanji-display { font-size: 120px; text-shadow: 0 0 20px #fff; height: 130px; line-height: 130px; text-align: center; }
        
        .rarity-high { text-shadow: 0 0 30px #ff0 !important; color: #ff0; }
        .rarity-god { text-shadow: 0 0 35px #f0f, 0 0 15px #ff0 !important; color: #fff; animation: god-glow 1s infinite alternate; }
        .rarity-god7 { text-shadow: 0 0 45px #f00, 0 0 25px #ff8 !important; color: #fff; animation: god7-glow 0.8s infinite alternate; }
        @keyframes god-glow { from { text-shadow: 0 0 20px #f0f, 0 0 10px #ff0; } to { text-shadow: 0 0 40px #ff0, 0 0 20px #f0f; } }
        @keyframes god7-glow { from { text-shadow: 0 0 30px #f00, 0 0 15px #ff0; } to { text-shadow: 0 0 60px #ff8, 0 0 30px #f00, 0 0 15px #fff; } }
        
        #gacha-result-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; width: 90%; margin-top: 10px; }
        .gacha-res-item { width: 60px; height: 60px; background: #111; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 16px; position: relative; text-align: center; }
        .gacha-res-item span.rarity { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .aura-btn { background: #033; border-color: #0aa; font-size: 10px; line-height: 1.2; padding: 2px 1px; }
        .aura-btn span { display: block; font-size: 7px; color: #0cc; }
        .skill-gacha-btn { background: #003; border-color: #00a; font-size: 10px; line-height: 1.2; padding: 2px 1px; }
        .skill-gacha-btn span { display: block; font-size: 7px; color: #08f; }

        .section-title { font-size: 11px; color: #0cc; margin: 4px 0 2px 0; padding-left: 4px; text-align: left; width: 100%; }
        .aura-item { font-size: 11px !important; line-height: 1.2; border-color: #088 !important; }
        .aura-item .aura-type { font-size: 14px; font-weight: bold; color: #0ff; }
        .aura-item .aura-effect { font-size: 8px; color: #aaa; margin-top: 2px; }
        
        .equipped-badge { font-size: 7px; position: absolute; bottom: 2px; left: 2px; color: #f0f; border: 1px solid #f0f; padding: 0 1px; background: #202; }
        .weapon-badge { font-size: 7px; position: absolute; bottom: 2px; right: 2px; color: #fff; border: 1px solid #aaa; padding: 0 1px; background: #333; }
        .current-aura-display { border: 1px dashed #0aa; background: #011; padding: 6px; margin: 5px 0; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }

        .seed-box-item { font-size: 10px !important; border-color: #050 !important; color: #0f0; background: #010; flex-direction: column; transition: 0.2s; }
        .seed-box-item:hover { background: #020; border-color: #0a0 !important; }
        .seed-box-title { font-size: 13px; font-weight: bold; }
        .seed-box-cost { font-size: 8px; color: #8c8; margin-top: 1px; }

        .weapon-box-item { font-size: 10px !important; border-color: #777 !important; color: #ddd; background: #222; flex-direction: column; transition: 0.2s; }
        .weapon-box-item:hover { background: #333; border-color: #fff !important; }
        .weapon-box-title { font-size: 11px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
        .weapon-box-effect { font-size: 8px; color: #aaa; margin-top: 1px; }

        .glow-回避 { animation: pulse-blue 2s infinite ease-in-out; }
        @keyframes pulse-blue { 0% { color: #d0f0ff; text-shadow: 0 0 6px rgba(0, 128, 255, 0.7), 0 0 12px rgba(0, 128, 255, 0.4); } 50% { color: #ffffff; text-shadow: 0 0 20px rgba(0, 160, 255, 1), 0 0 32px rgba(0, 100, 255, 0.8); } 100% { color: #d0f0ff; text-shadow: 0 0 6px rgba(0, 128, 255, 0.7), 0 0 12px rgba(0, 128, 255, 0.4); } }
        .glow-行動力 { animation: pulse-red 2s infinite ease-in-out; }
        @keyframes pulse-red { 0% { color: #ffd0d0; text-shadow: 0 0 6px rgba(255, 0, 0, 0.7), 0 0 12px rgba(255, 0, 0, 0.4); } 50% { color: #ffffff; text-shadow: 0 0 20px rgba(255, 60, 60, 1), 0 0 32px rgba(200, 0, 0, 0.8); } 100% { color: #ffd0d0; text-shadow: 0 0 6px rgba(255, 0, 0, 0.7), 0 0 12px rgba(255, 0, 0, 0.4); } }
        .glow-会心 { animation: pulse-purple 2s infinite ease-in-out; }
        @keyframes pulse-purple { 0% { color: #ffd0ff; text-shadow: 0 0 6px rgba(200, 0, 255, 0.7), 0 0 12px rgba(200, 0, 255, 0.4); } 50% { color: #ffffff; text-shadow: 0 0 20px rgba(230, 60, 255, 1), 0 0 32px rgba(150, 0, 230, 0.8); } 100% { color: #ffd0ff; text-shadow: 0 0 6px rgba(200, 0, 255, 0.7), 0 0 12px rgba(200, 0, 255, 0.4); } }
        .glow-回復 { animation: pulse-green 2s infinite ease-in-out; }
        @keyframes pulse-green { 0% { color: #d0ffd0; text-shadow: 0 0 6px rgba(0, 255, 128, 0.7), 0 0 12px rgba(0, 255, 128, 0.4); } 50% { color: #ffffff; text-shadow: 0 0 20px rgba(60, 255, 160, 1), 0 0 32px rgba(0, 200, 100, 0.8); } 100% { color: #d0ffd0; text-shadow: 0 0 6px rgba(0, 255, 128, 0.7), 0 0 12px rgba(0, 255, 128, 0.4); } }

        .sell-btn-area { display: flex; justify-content: flex-end; margin-top: 3px; margin-bottom: 5px; }
        .sell-action-btn { background: #200; border: 1px solid #f33; color: #f99; font-size: 10px; padding: 2px 8px; cursor: pointer; border-radius: 3px; }
        .sell-action-btn:disabled { border-color: #333; color: #555; background: #000; cursor: not-allowed; }
        
        .w-upgrade-zone { border: 1px solid #770; background: #110; padding: 6px; margin: 5px 0; font-size: 11px; text-align: left; box-sizing: border-box; }
        .w-upgrade-btn { background: #330; border: 1px solid #ff0; color: #ff0; padding: 4px 10px; font-size: 11px; cursor: pointer; margin-top: 5px; width: 100%; box-sizing: border-box; font-family: inherit; }
        .w-upgrade-btn:disabled { background: #111; border-color: #444; color: #666; cursor: not-allowed; }

        .stage-select-btn { width: 100%; height: 45px; text-align: left; padding-left: 15px; margin-bottom: 8px; font-size: 14px; position: relative; cursor: pointer;}
        .stage-select-btn.locked { border-color: #333; color: #555; cursor: not-allowed; background: #050505; }
        .stage-select-btn .lock-text { position: absolute; right: 15px; font-size: 10px; color: #f33; }
        .stage-select-btn .clear-text { position: absolute; right: 15px; font-size: 10px; color: #0f0; }
    </style>
</head>
<body>

<div id="game-screen">
    <div id="gacha-overlay">
        <div id="gacha-effect-text">召喚の儀</div>
        <div id="gacha-kanji-display"></div>
        <div id="gacha-result-name" style="margin-top:20px; font-size:18px; color:#ff0; min-height: 27px;"></div>
        <div id="gacha-result-list"></div>
        <button id="gacha-close-btn" onclick="closeGachaEffect()" style="margin-top:30px; padding: 10px 30px; display:none;">拝受</button>
    </div>

    <div class="global-info">
        <span>金: <span id="global-coin-count">0</span>枚 / 石: <span id="global-stone-count" style="color:#fff;">0</span>個</span>
        <div>
            <span id="header-stage-label">拠点</span>
            <button id="btn-retreat" class="exit-btn" style="display:none; margin-left:10px;" onclick="location.reload()">拠点に戻る</button>
        </div>
    </div>

    <div id="view-home" class="view active">
        <h2>深淵の拠点</h2>
        <div class="guide-text">※キャラを選択して種や装具を押すと付与・装備！</div>
        
        <div class="section-title">【仲間の漢字】</div>
        <div id="my-box" class="box-list" style="max-height: 180px; overflow-y: auto;"></div>
        <div class="sell-btn-area">
            <button id="btn-sell-unit" class="sell-action-btn" onclick="sellSelectedUnit()" disabled>選択した漢字を売却（別れの儀）</button>
        </div>
        
        <div class="section-title">【所持オーラ】</div>
        <div id="aura-box" class="box-list" style="max-height: 130px; overflow-y: auto;"></div>

        <div class="section-title">【抽出・獲得したスキルの種】</div>
        <div id="seed-box" class="box-list" style="max-height: 130px; overflow-y: auto;"></div>

        <div class="section-title">【所持している装具（武器）】</div>
        <div id="weapon-box" class="box-list" style="max-height: 130px; overflow-y: auto;"></div>

        <div class="controls" style="grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); height: 110px; margin-top: 10px; gap: 4px;">
            <button class="gacha-btn" onclick="playGacha(1)">通常単発<span>(10枚)</span></button>
            <button class="gacha-btn" onclick="playGacha(10)">通常10連<span>(100枚)</span></button>
            <button class="gacha-btn" style="background:#402; border-color:#d0d;" onclick="playPremiumGacha(1)">上級単発<span>(100枚)</span></button>
            <button class="gacha-btn" style="background:#503; border-color:#f0f;" onclick="playPremiumGacha(10)">上級10連<span>(1000枚)</span></button>
            
            <button class="aura-btn" onclick="playAuraGacha()">霊気ガチャ<span>(30枚)</span></button>
            <button class="skill-gacha-btn" onclick="playSkillGacha()">スキルガチャ<span>(20枚)</span></button>
            <button class="boss-btn" style="grid-column: span 2;" onclick="openBossSelection()">強者の間</button>
            
            <button class="dig-btn" style="grid-column: span 2;" onclick="openDigSelection()">発掘開始</button>
            <button id="btn-start" style="grid-column: span 2;" onclick="openStageSelection()">戦場出撃</button>
        </div>
    </div>

    <div id="view-stage-select" class="view">
        <h2>作戦領域選択</h2>
        <div class="guide-text" style="margin-bottom: 15px;">※現在の最高クリア階層によって新たな領域が解放されます。</div>
        <div id="stage-select-list" style="display: flex; flex-direction: column;"></div>
        <button onclick="closeStageSelection()" style="height:45px; margin-top:15px;">拠点に戻る</button>
    </div>

    <div id="view-boss-select" class="view">
        <h2 style="color:#f00;">強者の間</h2>
        <div id="boss-list" class="box-list" style="grid-template-columns: 1fr; max-height: 480px; overflow-y: auto;"></div>
        <button onclick="closeBossSelection()" style="height:50px; margin-top:10px;">拠点に戻る</button>
    </div>

    <div id="view-dig-select" class="view">
        <h2 style="color:#ff0;">発掘領域選択</h2>
        <div id="dig-select-list" style="display: flex; flex-direction: column; max-height: 480px; overflow-y: auto; padding: 5px;"></div>
        <button onclick="closeDigSelection()" style="height:45px; margin-top:15px;">拠点に戻る</button>
    </div>

    <div id="view-shop" class="view">
        <h2 style="color:#0aa; font-size:16px;">修練・継承・装具の儀</h2>
        <div id="shop-unit-detail" style="text-align:center; padding:8px; border:1px solid #0aa; margin-bottom:5px; background:#011;"></div>
        
        <!-- スロット枠拡張エリア -->
        <div class="slot-upgrade-zone" style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px;">
            <button class="buy-btn" id="btn-upgrade-skill-slot" onclick="buySlot('skill')" style="background:#020; border-color:#0a0; font-size:12px;">技枠拡張</button>
            <button class="buy-btn" id="btn-upgrade-aura-slot" onclick="buySlot('aura')" style="background:#002; border-color:#00a; font-size:12px;">霊気枠拡張</button>
        </div>

        <div id="current-aura-zone"></div>
        <div id="weapon-upgrade-zone" class="w-upgrade-zone"></div>
        
        <div class="buy-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
            <button class="buy-btn" onclick="buyStat('p', 300)">攻撃+1<span>(300枚)</span></button>
            <button class="buy-btn" onclick="buyStat('h', 300)">HP+1<span>(300枚)</span></button>
            <button class="buy-btn" onclick="buyStat('s', 500)">速さ+1<span>(500枚)</span></button>
            <button class="buy-btn" onclick="buyStat('m', 800)">MP+1<span>(800枚)</span></button>
        </div>
        <div class="section-title" id="shop-sub-title">【装備可能なオーラ一覧】</div>
        <div class="seed-list" id="shop-inventory-list" style="height:150px; border:1px solid #222; background:#000; font-size:11px; padding:5px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
        <button id="btn-extract" onclick="extractSkill()" style="margin: 6px 0 2px 0; background:#303; font-size:11px; height:30px;">スキル抽出（※全オーラ・装具は手元に戻ります）</button>
        <button onclick="closeShop()" style="height:40px; margin-top:5px;">拠点に戻る</button>
    </div>

    <div id="view-battle" class="view">
        <div id="turn-order"></div>
        <div id="enemy-area" class="unit-area"></div>
        <div id="log"></div>
        <div id="player-area" class="unit-area"></div>
        
        <!-- 戦闘基本操作パネル -->
        <div id="battle-controls" class="controls" style="margin-top:5px; grid-template-columns: 1fr 1fr;">
            <button id="btn-atk" onclick="startTargetSelection('attack')">たたかう</button>
            <button id="btn-skl" onclick="showSkillMenu()">スキル</button>
        </div>
        <!-- 複数スキル選択パネル -->
        <div id="skill-select-controls" class="controls" style="margin-top:5px; grid-template-columns: repeat(2, 1fr); display:none; height:auto; min-height:55px; gap:4px;"></div>
    </div>
</div>

    }

// データ構造の正規化・旧データ移行用
function normalizeBoxData() {
    box.forEach(c => {
        if (c.maxSkillSlots === undefined) c.maxSkillSlots = 1;
        if (!c.skills) {
            c.skills = [];
            if (c.skill) c.skills.push({ name: c.skill, cost: c.cost || 1 });
        }
        if (c.maxAuraSlots === undefined) c.maxAuraSlots = 1;
        if (!c.auraIds) {
            c.auraIds = [];
            if (c.auraId) c.auraIds.push(c.auraId);
        }
    });
}

function saveData() { 
    normalizeBoxData();
    localStorage.setItem('kanji_rpg_v2_data', JSON.stringify({ coins, stones, box, selectedIds, seeds, auras, weapons, maxClearedStage })); 
}

function loadData() {
    const saved = localStorage.getItem('kanji_rpg_v2_data');
    if (saved) {
        const d = JSON.parse(saved);
        box = (d.box || []).filter(c => c && c.name);
        coins = d.coins || 0; stones = d.stones || 0;
        selectedIds = (d.selectedIds || []).filter(sid => box.some(b => b.id === sid));
        seeds = d.seeds || []; auras = d.auras || []; weapons = d.weapons || []; 
        maxClearedStage = d.maxClearedStage || 0; 
        normalizeBoxData();
        return true;
    } return false;
}

function sellSelectedUnit() {
    if (selectedIds.length === 0) return;
    const targetId = selectedIds[selectedIds.length - 1];
    const char = box.find(b => b.id === targetId);
    if (!char) return;
    if (box.length <= 1) return alert("最後の1体は売却（お別れ）できません。");
    
    let rewardCoin = 1;
    if (char.r === 2) rewardCoin = 2; else if (char.r === 3) rewardCoin = 3; else if (char.r === 4) rewardCoin = 5;
    else if (char.r === 5) rewardCoin = 8; else if (char.r === 6) rewardCoin = 30; else if (char.r >= 7) rewardCoin = 100;
    
    if (confirm(`選択中の「${char.name} (★${char.r})」と別れの儀を行いますか？\n（取得コイン: ${rewardCoin}枚）`)) {
        coins += rewardCoin; char.auraId = null; char.auraIds = []; char.weaponId = null;
        box = box.filter(b => b.id !== targetId); selectedIds = selectedIds.filter(sid => sid !== targetId);
        saveData(); updateHomeUI(); alert(`${char.name} とお別れし、コインを ${rewardCoin} 枚獲得しました。`);
    }
}

function attachSeedFromHome(seedIndex) {
    if (selectedIds.length === 0) return alert("種を付ける漢字を選択してください。");
    const targetId = selectedIds[selectedIds.length - 1];
    const char = box.find(b => b.id === targetId);
    if (char) {
        if (!char.skills) char.skills = [];
        const seed = seeds[seedIndex];
        
        if (char.skills.length < (char.maxSkillSlots || 1)) {
            char.skills.push({ name: seed.name, cost: seed.cost || 1 });
            seeds.splice(seedIndex, 1);
            alert(`${char.name} に 【${seed.name}】 のスキルを付与しました！`);
        } else {
            if (!confirm(`技スロットが一杯です。1番目のスキル【${char.skills[0].name}】を上書きして【${seed.name}】を習得させますか？`)) return;
            char.skills[0] = { name: seed.name, cost: seed.cost || 1 };
            seeds.splice(seedIndex, 1);
            alert(`${char.name} のスキルを上書き習得させました！`);
        }
        char.skill = char.skills[0] ? char.skills[0].name : "";
        char.cost = char.skills[0] ? char.skills[0].cost : 1;
        saveData(); updateHomeUI();
    }
}

function equipWeaponFromHome(weaponIndex) {
    if (selectedIds.length === 0) return alert("武器を装備させる漢字を選択してください。");
    const targetId = selectedIds[selectedIds.length - 1]; const char = box.find(b => b.id === targetId);
    const weapon = weapons[weaponIndex]; if (!char || !weapon) return;
    const currentOwner = box.find(b => b.weaponId === weapon.id); if (currentOwner) currentOwner.weaponId = null;
    if (char.weaponId === weapon.id) { char.weaponId = null; alert(`${char.name} の装具を外しました。`); } 
    else { char.weaponId = weapon.id; const bonus = getWeaponBonus(weapon.name); alert(`${char.name} に 【${weapon.name}】 を装備しました！（攻撃力+${bonus}）`); }
    saveData(); updateHomeUI();
}

function executeWeaponUpgrade(weaponId) {
    if (stones < 3) return alert("強化石が3個不足しています。");
    const wp = weapons.find(w => w.id === weaponId); if (!wp) return; const upInfo = getNextUpgradeInfo(wp.name); if (!upInfo || !upInfo.nextName) return;
    stones -= 3; if (Math.random() * 100 < upInfo.rate) { const oldName = wp.name; wp.name = upInfo.nextName; alert(`✨強化成功！✨\n【${oldName}】は【${wp.name}】へと鍛え上げられた！`); } else { alert(`❌強化失敗...❌`); }
    saveData(); updateShopUI();
}

function equipAura(auraId) { 
    const char = box.find(b => b.id === shopTargetId); if (!char) return;
    if (!char.auraIds) char.auraIds = [];
    
    const newAura = auras.find(a => a.id === auraId);
    if (!newAura) return;

    // 【重要】同じタイプの重複装備禁止
    const isDuplicate = char.auraIds.some(aid => {
        const existing = auras.find(a => a.id === aid);
        return existing && existing.type === newAura.type;
    });
    if (isDuplicate) return alert(`既に同じタイプ【${newAura.type}】の霊気を装備しています！`);

    if (char.auraIds.length < (char.maxAuraSlots || 1)) {
        char.auraIds.push(auraId);
    } else {
        return alert("霊気スロットに空きがありません。");
    }
    saveData(); updateShopUI(); 
}

function applySeed(idx) { 
    const char = box.find(b => b.id === shopTargetId); if(!char) return;
    if (!char.skills) char.skills = [];
    if (char.skills.length < (char.maxSkillSlots || 1)) {
        char.skills.push({ name: seeds[idx].name, cost: seeds[idx].cost });
        seeds.splice(idx, 1);
        char.skill = char.skills[0].name; char.cost = char.skills[0].cost;
        saveData(); updateShopUI();
    } else {
        alert("技スロットに空きがありません。");
    }
}

function extractSkill() { 
    const char = box.find(b => b.id === shopTargetId); 
    if (char && !char.special && confirm("本当にこの漢字を消滅させ、修得している全てのスキルを種として抽出しますか？（※装具やオーラは全て返却されます）")) { 
        if (char.skills) {
            char.skills.forEach(s => seeds.push({ name: s.name, cost: s.cost || 1 }));
        }
        char.auraId = null; char.auraIds = []; char.weaponId = null; 
        box = box.filter(b => b.id !== shopTargetId); selectedIds = selectedIds.filter(sid => sid !== shopTargetId); 
        saveData(); closeShop(); 
    } 
}

function setupBattleData(arr, isP) {
    return arr.map(c => {
        let wpBonus = 0; if (isP && c.weaponId && weapons.find(w => w.id === c.weaponId)) wpBonus = getWeaponBonus(weapons.find(w => w.id === c.weaponId).name);
        
        // 複数オーラ、スキルの読み込み
        let activeAuras = [];
        if (isP && c.auraIds) {
            c.auraIds.forEach(aid => { const au = auras.find(a => a.id === aid); if(au) activeAuras.push(au); });
        }
        let activeSkills = [];
        if (c.skills && c.skills.length > 0) {
            activeSkills = c.skills.map(s => ({ name: s.name, cost: s.cost }));
        } else if (c.skill) {
            activeSkills = [{ name: c.skill, cost: c.cost || 1 }];
        }

        return {
            ...c, curH: c.h, maxH: c.h, curM: c.m, maxM: c.m, p: c.p + wpBonus, baseP: c.p + wpBonus, baseS: c.s, 
            isP: isP, poison: false, guard: false, charm: 0, lastDmg: 0, 
            auras: activeAuras, skillsList: activeSkills, 
            usedPhoenix: false, blind: 0, paralyze: 0, atkBuff: 0, invincible: 0, deathTrap: false
        };
    });
}

function checkAndRevivePhoenix(u) {
    if (u.curH <= 0 && (u.name === '不死鳥' || (u.skillsList && u.skillsList.some(s=>s.name==='不死の再生'))) && !u.usedPhoenix) {
        u.curH = u.maxH; u.curM = u.maxM; u.usedPhoenix = true; addLog(`✨【不死の再生】${u.name}は炎を纏い完全復活した！`); return true;
    } return false;
}

function cycle() {
    const all = [...party, ...enemies];
    all.forEach(u => {
        if (u.name === '蛆' && u.curH <= 0 && all.some(p => p.name === '蝿' && p.curH > 0 && p.isP === u.isP)) { u.curH = 1; addLog(`${u.name}が再生した！`); }
        if (u.name === '狼' && u.curH > 0) { const count = all.filter(o => o.name === '狼' && o.curH > 0 && o.isP === u.isP && o.id !== u.id).length; u.p = u.baseP + count; u.s = u.baseS + count; }
        u.guard = false;
    });
    queue = all.filter(u => u.curH > 0).sort((a,b)=>b.s - a.s); qIdx = 0; if (queue.length === 0) return next();
    document.getElementById('turn-order').innerText = queue.map(u => u.name).join(" > ");
    
    // 全オーラの毎ターン回復判定
    queue.forEach(u => {
        if (u.auras) {
            u.auras.forEach(au => {
                if (au.type === '回復') {
                    const healVal = Math.floor(u.maxH * (au.value / 100));
                    if (healVal > 0) { u.curH = Math.min(u.maxH, u.curH + healVal); addLog("🌿" + u.name + "回復 +" + healVal); }
                }
            });
        }
    });
    updateUI(); remainingActions = 0; turn();
}

async function turn() {
    isSelecting = false; currentAction = null; selectedBattleSkill = null; updateUI(); 
    const u = queue[qIdx]; if (!u || u.curH <= 0) return next();
    
    if (darumaTrigger !== null && darumaTrigger !== u.isP) { darumaTrigger = null; u.curH = Math.max(0, u.curH - 20); addLog(`🚨 「達磨さんが転んだ」の呪い！ ${u.name}に20ダメ！`); checkAndRevivePhoenix(u); if (u.curH <= 0) return next(); }
    if (u.paralyze > 0) { u.paralyze--; addLog(`⚡ ${u.name}は麻痺して動けない！`); return next(); }
    if (u.deathTrap) { if (Math.random() < 0.1) { u.curH = Math.max(0, u.curH - 20); addLog(`☠️【デストラップ】${u.name}に20ダメ！`); checkAndRevivePhoenix(u); if (u.curH <= 0) return next(); } }

    if (u.blind > 0) u.blind--; if (u.atkBuff > 0) u.atkBuff--; if (u.invincible > 0) u.invincible--;

    if (remainingActions <= 0) {
        remainingActions = 1; 
        if (u.auras) {
            const au = u.auras.find(a => a.type === '行動力');
            if(au) {
                let bonus = au.value; if (au.r === 2) bonus = Math.random() < 0.5 ? 1 : 2; if (au.r === 4) bonus = Math.random() < 0.5 ? 2 : 3;
                remainingActions = bonus; if (remainingActions > 1) addLog("⚡【行動力】" + u.name + "（残り行動:" + remainingActions + "回）");
            }
        }
    }
    if (u.poison) { u.curH = Math.max(0, u.curH - 1); addLog(u.name + "：毒1ダメ"); checkAndRevivePhoenix(u); if(u.curH <= 0) return next(); }
    if (u.charm > 0) { u.charm--; addLog(u.name + "は魅了中！"); await new Promise(r => setTimeout(r, 600)); const allies = (u.isP ? party : enemies).filter(a => a.curH > 0 && a.id !== u.id); if (allies.length > 0) executeAction(u, allies[Math.floor(Math.random()*allies.length)], 'attack'); else next(); return; }

    if (u.isP) { 
        document.getElementById('battle-controls').style.display = 'grid';
        document.getElementById('skill-select-controls').style.display = 'none';
        document.getElementById('btn-atk').disabled = false; 
        
        // パッシブを除いた有効な手動スキルを保持しているか
        const hasManualSkill = u.skillsList && u.skillsList.some(s => s.name !== '再生' && s.name !== '不死の再生');
        document.getElementById('btn-skl').disabled = !hasManualSkill; 
    } 
    else {
        document.getElementById('btn-atk').disabled = true; document.getElementById('btn-skl').disabled = true; await new Promise(r => setTimeout(r, 600));
        const t_list = party.filter(p => p.curH > 0);
        if (t_list.length > 0) {
            const enemySkillObj = u.skillsList ? u.skillsList[0] : null;
            const enemySkill = enemySkillObj ? enemySkillObj.name : u.skill;
            let costM = SKILL_DATA[enemySkill] ? SKILL_DATA[enemySkill].cost : (u.cost || 1);
            let hasAoE = ['感電','咆哮','鱗粉','御廚子','巨大触手','炎のブレス','伏魔御廚子','ムチ','ブリザード','妖精の粉','攻撃増幅薬','蘇りの歌','強固な甲羅','天変地異','デスペラードヒューリー'].includes(enemySkill);
            let canCast = (u.curM >= costM); if(enemySkill==='捨て身') canCast = (u.curH > 5); if(enemySkill==='精霊の歌') canCast = (u.curH > 1);
            if ((hasAoE || ['毒牙','丸呑み','連撃','イーター','猛毒','達磨さんが転んだ','神の審判','マジ殴り','回復','閃光','斬撃','大回復','麻痺','捨て身','応援','支配','メテオ','デストラップ','フェニックス','精霊の歌'].includes(enemySkill)) && canCast) {
                if (enemySkill === 'フェニックス' || enemySkill === '精霊の歌') { const deads = enemies.filter(e => e.curH <= 0); if(deads.length > 0) executeAction(u, deads[Math.floor(Math.random()*deads.length)], 'skill', enemySkill); else executeAction(u, t_list[Math.floor(Math.random()*t_list.length)], 'attack'); }
                else executeAction(u, t_list[Math.floor(Math.random()*t_list.length)], 'skill', enemySkill);
            } else executeAction(u, t_list[Math.floor(Math.random()*t_list.length)], 'attack');
        } else next();
    }
}

// 【新規】戦闘中にスキルボタンを押した際にスキル一覧を表示する処理
function showSkillMenu() {
    const u = queue[qIdx];
    if (!u) return;
    const selectArea = document.getElementById('skill-select-controls');
    document.getElementById('battle-controls').style.display = 'none';
    selectArea.style.display = 'grid';
    
    let btnHtml = "";
    u.skillsList.forEach(s => {
        if (s.name === '再生' || s.name === '不死の再生') return;
        let costM = SKILL_DATA[s.name] ? SKILL_DATA[s.name].cost : 1;
        let canCast = true;
        let cText = `MP:${costM}`;
        if(s.name === '捨て身') { canCast = (u.curH > 5); cText = "HP:5"; }
        else if(s.name === '精霊の歌') { canCast = (u.curH > 1); cText = "HP半減"; }
        else { canCast = (u.curM >= costM); }
        
        btnHtml += `<button onclick="confirmSkillSelection('${s.name}')" ${!canCast?'disabled':''} style="font-size:12px; line-height:1.2; padding:4px 2px;">${s.name}<br><span style="font-size:8px; color:#ff0;">(${cText})</span></button>`;
    });
    btnHtml += `<button onclick="cancelSkillMenu()" style="background:#222; font-size:12px;">戻る</button>`;
    selectArea.innerHTML = btnHtml;
}

function cancelSkillMenu() {
    document.getElementById('skill-select-controls').style.display = 'none';
    document.getElementById('battle-controls').style.display = 'grid';
}

function confirmSkillSelection(skillName) {
    selectedBattleSkill = skillName;
    document.getElementById('skill-select-controls').style.display = 'none';
    startTargetSelection('skill', skillName);
}

function startTargetSelection(type, skillName = null) {
    const u = queue[qIdx]; 
    const sName = skillName || (u.skillsList && u.skillsList[0] ? u.skillsList[0].name : u.skill);
    
    if (type === 'skill') { 
        let isAoE = ['感電','咆哮','鱗粉','御廚子','巨大触手','炎のブレス','伏魔御廚子','達磨さんが転んだ','ムチ','ブリザード','妖精の粉','攻撃増幅薬','蘇りの歌','強固な甲羅','天変地異','デスペラードヒューリー','支配'].includes(sName);
        if (isAoE) return executeAction(u, null, 'skill', sName);
    }
    
    isSelecting = true; currentAction = type; 
    addLog(type === 'attack' ? "標的を選択" : `【${sName}】の対象を選択`); 
    updateUI();
}

function onUnitClick(targetId) {
    if (!isSelecting) return;
    const target = [...party, ...enemies].find(char => char.id === targetId); if (!target) return;
    const u = queue[qIdx];
    const sName = selectedBattleSkill || (u.skillsList && u.skillsList[0] ? u.skillsList[0].name : u.skill);
    
    if (currentAction === 'skill' && (sName === 'フェニックス' || sName === '精霊の歌')) { if (target.curH > 0) return addLog("倒れた味方を選択してください。"); } 
    else { if (target.curH <= 0) return; }
    executeAction(queue[qIdx], target, currentAction, sName); isSelecting = false; currentAction = null;
}

function executeAction(u, t, type, skillName = null) {
    if (type === 'attack') {
        if (u.blind > 0 && Math.random() < 0.3) { addLog("💫【閃光】" + u.name + "の攻撃は外れた！"); return next(); }
        
        // 全装備オーラから回避を検索
        let isEvaded = false;
        if (t.auras) {
            const evadeAu = t.auras.find(a => a.type === '回避');
            if (evadeAu && Math.random() * 100 < evadeAu.value) isEvaded = true;
        }
        if (isEvaded) { addLog("💨【回避】" + t.name + "は避けた！"); return next(); }
        if (t.invincible > 0) { addLog("🛡️【強固な甲羅】" + t.name + "へのダメージは0！"); return next(); }
        
        let dmg = u.p; if (isGlobalDomination) dmg = Math.ceil(dmg / 2); if (u.atkBuff > 0) dmg *= 2;
        let isCrit = false; 
        if (u.auras) {
            const critAu = u.auras.find(a => a.type === '会心');
            if (critAu && Math.random() * 100 < critAu.value) { dmg *= 2; isCrit = true; }
        }
        if (t.guard) dmg = 1;
        t.curH = Math.max(0, t.curH - dmg); u.lastDmg = dmg;
        if (isCrit) addLog("💥" + u.name + "の会心の一撃：" + dmg + "ダメ"); else addLog(u.name + "の攻撃：" + dmg + "ダメ");
        checkAndRevivePhoenix(t);
    } else {
        const sName = skillName || u.skill;
        let costM = SKILL_DATA[sName] ? SKILL_DATA[sName].cost : 1;
        if (sName === '捨て身') u.curH -= 5; else if (sName === '精霊の歌') u.curH -= Math.max(1, Math.floor(u.curH / 2)); else u.curM -= costM;
        
        addLog(u.name + "：【" + sName + "】"); const targets = u.isP ? enemies : party; const allies = u.isP ? party : enemies;
        
        if (sName === '回復') { t.curH = Math.min(t.maxH, t.curH + Math.floor(t.maxH*0.3)); addLog(t.name + "が30%回復！"); }
        else if (sName === '閃光') { t.blind = 1; addLog(t.name + "の命中率が低下！"); }
        else if (sName === '斬撃') { if(t.invincible>0) addLog("無効！"); else { t.curH = Math.max(0, t.curH - 5); checkAndRevivePhoenix(t); addLog(t.name+"に5ダメ！");} }
        else if (sName === 'ムチ') { targets.forEach(e => { if(e.curH>0) { if(e.invincible>0)return; e.curH = Math.max(0, e.curH - 2); checkAndRevivePhoenix(e); }}); addLog("全体に2ダメ！");}
        else if (sName === '大回復') { t.curH = Math.min(t.maxH, t.curH + Math.floor(t.maxH*0.6)); addLog(t.name + "が60%回復！"); }
        else if (sName === '麻痺') { if (Math.random() < 0.3) { t.paralyze = 1; addLog(t.name+"は麻痺した！"); } else addLog("効かなかった..."); }
        else if (sName === '捨て身') { if(t.invincible>0) addLog("無効！"); else { t.curH = Math.max(0, t.curH - 10); checkAndRevivePhoenix(t); addLog(t.name+"に10ダメ！");} }
        else if (sName === '応援') { t.atkBuff = 1; addLog(t.name+"の攻撃力が倍化！"); }
        else if (sName === '攻撃増幅薬') { allies.forEach(a => { if(a.curH>0) a.atkBuff = 1; }); addLog("味方全員の攻撃力が倍化！"); }
        else if (sName === 'ブリザード') { targets.forEach(e => { if(e.curH>0) { if(e.invincible<=0) {e.curH = Math.max(0, e.curH - 10); checkAndRevivePhoenix(e);} e.s -= 2; }}); addLog("全体に10ダメ＆素早さ低下！"); }
        else if (sName === '支配') { isGlobalDomination = true; addLog("支配空間展開！全員の攻撃力が半減！"); }
        else if (sName === '妖精の粉') { allies.forEach(a => { if(a.curH>0) a.curH = Math.min(a.maxH, a.curH + Math.floor(a.maxH*0.8)); }); addLog("味方全員が80%回復！"); }
        else if (sName === 'メテオ') { if(t.invincible>0) addLog("無効！"); else { t.curH = Math.max(0, t.curH - 35); checkAndRevivePhoenix(t); addLog(t.name+"に35ダメ！");} }
        else if (sName === 'デストラップ') { t.deathTrap = true; addLog(t.name+"に死の罠を仕掛けた！"); }
        else if (sName === 'フェニックス') { t.curH = t.maxH; t.usedPhoenix = false; addLog(t.name+"が完全復活！"); }
        else if (sName === '蘇りの歌') { allies.forEach(a => { if(a.curH<=0) { a.curH = a.maxH; a.usedPhoenix = false; } }); addLog("倒れた味方全員が完全復活！"); }
        else if (sName === '強固な甲羅') { allies.forEach(a => { if(a.curH>0) a.invincible = 1; }); addLog("味方全員の受けるダメージが0になった！"); }
        else if (sName === '天変地異') { targets.forEach(e => { if(e.curH>0) { if(e.invincible<=0) {e.curH = Math.max(0, e.curH - 150); checkAndRevivePhoenix(e);} }}); addLog("全体に150の絶大ダメージ！"); }
        else if (sName === 'デスペラードヒューリー') { 
            let count = 0;
            const hit = () => {
                const alive = targets.filter(e => e.curH > 0); if(alive.length === 0) return;
                const trg = alive[Math.floor(Math.random()*alive.length)];
                if(trg.invincible<=0) { trg.curH = Math.max(0, trg.curH - 50); addLog(trg.name+"に50ダメ！"); checkAndRevivePhoenix(trg); } else addLog("無効！");
                count++; if(count < 5 && targets.some(e=>e.curH>0)) hit();
            }; hit();
        }
        else if (sName === '精霊の歌') { t.curH = Math.floor(t.maxH / 2); t.usedPhoenix = false; addLog(t.name+"が半分の体力で復活！"); }
        else if (sName === '感電') { targets.forEach(e => { if(e.curH>0 && e.invincible<=0) { e.curH = Math.max(0, e.curH - 3); checkAndRevivePhoenix(e); } }); }
        else if (sName === '御廚子' || sName === '伏魔御廚子') { targets.forEach(e => { if(e.curH>0 && e.invincible<=0) { e.curH = Math.max(0, e.curH - 30); checkAndRevivePhoenix(e); } }); addLog("領域展開。全体に30の固定ダメージ！"); }
        else if (sName === '巨大触手') { targets.forEach(e => { if(e.curH>0 && e.invincible<=0) { e.curH = Math.max(0, e.curH - 10); checkAndRevivePhoenix(e); } }); addLog("全体に10ダメージ！"); }
        else if (sName === '炎のブレス') { targets.forEach(e => { if(e.curH>0 && e.invincible<=0) { e.curH = Math.max(0, e.curH - 20); checkAndRevivePhoenix(e); } }); addLog("全体に20ダメージ！"); }
        else if (sName === '達磨さんが転んだ') { darumaTrigger = u.isP; addLog("達磨がこちらを凝視している...（罠発動）"); }
        else if (sName === '神の審判') { if(t.invincible<=0) { const judgeDmg = Math.random() < 0.5 ? 10 : 60; t.curH = Math.max(0, t.curH - judgeDmg); addLog(`${t.name}に ${judgeDmg} の審判ダメージ！`); checkAndRevivePhoenix(t); } }
        else if (sName === '連撃') { if(t.invincible<=0) { let d1 = u.p; t.curH = Math.max(0, t.curH - d1); checkAndRevivePhoenix(t); let d2 = u.p; t.curH = Math.max(0, t.curH - d2); checkAndRevivePhoenix(t); u.lastDmg = d1 + d2; addLog(`連続斬撃！ ${t.name}に ${d1}、${d2} ダメージ！`); } }
        else if (sName === 'マジ殴り') { if(t.invincible<=0) { t.curH = Math.max(0, t.curH - 200); addLog(`必殺のマジ殴り！ ${t.name}に200ダメ！`); checkAndRevivePhoenix(t); } }
        else if (sName === 'イーター') { if(t.invincible<=0) { t.curH = Math.max(0, t.curH - 30); u.curH = Math.min(u.maxH, u.curH + 30); addLog(`魂を喰らう！ 30ダメ＆30回復！`); checkAndRevivePhoenix(t); } }
        else if (sName === '魅了') { t.charm = 2; addLog(t.name + "を魅了！"); } else if (sName === '吸血') { u.curH = Math.min(u.maxH, u.curH + 3); }
        else if (sName === '血欲') { if(t.invincible<=0) { t.curH = Math.max(0, t.curH - 2); u.curH = Math.min(u.maxH, u.curH + 2); checkAndRevivePhoenix(t); } }
        else if (sName === '物真似') { if(t.invincible<=0) { t.curH = Math.max(0, t.curH - u.lastDmg); checkAndRevivePhoenix(t); } }
        else if (sName === '賢者の知恵') { t.curH = Math.min(t.maxH, t.curH + 5); } else if (sName === '鱗粉') targets.forEach(e => { if(e.curH>0) e.poison = true; });
        else if (sName === '咆哮') targets.forEach(e => { if(e.curH>0 && e.invincible<=0) { e.curH = Math.max(0, e.curH - 8); checkAndRevivePhoenix(e); } });
        else if (sName === '身代わり') { u.guard = true; } else if (sName === '転生') { t.curH = t.maxH; }
        else if (sName === '毒牙' || sName === '猛毒') { t.poison = true; addLog(t.name + "を致命的な毒にした！"); }
        else if (sName === '甘い蜜') { t.curH = Math.min(t.maxH, t.curH + 3); addLog(t.name + "が3回復！"); }
        else if (sName === '丸呑み') { if(t.invincible<=0) { t.curH = Math.max(0, t.curH - 15); addLog(t.name + "に15の固定ダメージ！"); checkAndRevivePhoenix(t); } }
    }
    selectedBattleSkill = null;
    next();
}

function next() {
    updateUI();
    if (enemies.every(e => e.curH <= 0)) { 
        party.forEach(p => { p.curH = p.maxH; p.curM = p.m; p.poison = false; p.charm = 0; p.guard = false; p.usedPhoenix = false; });
        addLog("勝利！全員全回復した");
        if (isBossMode) {
            addLog("強者を退けた！"); if (Math.random() < 0.05) { const base = charData.find(c => c.name === currentBossName); box.push({...base, id: Math.random(), auraId: null, auraIds: [], weaponId: null}); addLog("★" + currentBossName + "が仲間に加わった！"); }
            saveData(); setTimeout(()=>location.reload(), 1500);
        } else if (isDigMode) {
            const d = digDataList[currentDigTier]; weapons.push({ id: Math.random(), name: d.wp }); addLog(`秘宝発掘成功！⚔️【${d.wp}】を獲得！`);
            if (Math.random() < d.stoneChance) { stones += d.stoneCount; addLog(`💎【強化石】を${d.stoneCount}個獲得！`); }
            saveData(); setTimeout(() => location.reload(), 3000);
        } else {
            let reward = 1; if (stage >= 31 && stage <= 50) reward = 4; else if (stage >= 51 && stage <= 100) reward = 5; else if (stage >= 101 && stage <= 200) reward = 8; else if (stage >= 201) reward = 12; else reward = Math.ceil(stage/10);
            coins += reward; document.getElementById('global-coin-count').innerText = coins; addLog(`報酬：コイン ${reward} 枚獲得！`);
            if (stage > maxClearedStage) maxClearedStage = stage; saveData(); stage++; setTimeout(initBattle, 800);
        } return; 
    }
    if (party.every(p => p.curH <= 0)) { addLog("全滅..."); setTimeout(()=>location.reload(), 2000); return; }

    remainingActions--;
    if (remainingActions > 0 && queue[qIdx] && queue[qIdx].curH > 0) { addLog("⚡ 連撃発動！（残り行動: " + remainingActions + "回）"); turn(); } 
    else { remainingActions = 0; qIdx++; if (qIdx >= queue.length) cycle(); else turn(); }
}

function updateUI() {
    const activeUnit = queue[qIdx];
    const draw = (u) => {
        let classes = `char-box ${u.curH<=0?'dead':''} ${activeUnit && u.id===activeUnit.id?'active-unit':''}`; if (isSelecting) classes += ' selectable';
        
        let auraClass = ""; 
        if (u.curH > 0 && u.auras && u.auras.length > 0) auraClass = `glow-${u.auras[0].type}`; // 最初のオーラを発光
        
        let overrideColor = ""; if (u.charm > 0) overrideColor = "color:#f0f;"; else if (u.poison) overrideColor = "color:#0f0;"; else if (u.guard || u.invincible > 0) overrideColor = "color:#0aa;";
        
        return `<div class="${classes}" onclick="onUnitClick(${u.id})">
            <span class="kanji ${auraClass}" style="${overrideColor}; font-size:${u.name.length >= 4 ? '15px' : '38px'}; white-space:nowrap;">${u.name}</span>
            <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${(u.curH/u.maxH)*100}%\"></div></div>
            <div class="stats-text">H:${u.curH} P:${u.p}</div>
        </div>`;
    };
    document.getElementById('player-area').innerHTML = party.map(draw).join(''); document.getElementById('enemy-area').innerHTML = enemies.map(draw).join('');
}
function addLog(m) { const l = document.getElementById('log'); l.innerText += m + "\n"; l.scrollTop = l.scrollHeight; }

if (!loadData()) { ['蟻','蝿','蛆'].forEach(n => { const b = charData.find(c => c.name === n); if(b) box.push({...b, id: Math.random(), auraId: null, auraIds: [], weaponId: null}); }); maxClearedStage = 0; saveData(); }
updateHomeUI();
</script>
